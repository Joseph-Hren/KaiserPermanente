name: Deploy site + Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Storybook is deployed under /storybook/ so the live app can stay at the site root.
      - run: npm run build-storybook
        env:
          STORYBOOK_BASE_PATH: /KaiserPermanente/storybook/

      - name: Assemble site
        run: |
          mkdir -p _site
          # Publish every root-level page except archived ones.
          for f in *.html; do
            [ "$f" = "index-old.html" ] || cp "$f" _site/
          done
          cp styles.css app.js data.js _site/
          cp -r assets _site/assets
          cp -r components _site/components
          mkdir -p _site/storybook
          cp -r storybook-static/. _site/storybook/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
