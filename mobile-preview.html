<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaiser Claims Portal — Mobile Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 60% 30%, #2c3e50 0%, #1a1a2e 60%, #0d0d14 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 64px 40px 80px;
    }

    .phone {
      position: relative;
      width: 430px;
      height: 932px;
      background: #1c1c1e;
      border-radius: 52px;
      box-shadow:
        inset 0 0 0 1.5px #3a3a3c,
        inset 0 0 0 2.5px #111,
        0 0 0 1px #0a0a0a,
        0 40px 100px rgba(0, 0, 0, 0.75),
        0 12px 30px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    /* Left side: mute toggle + volume buttons */
    .btn-mute {
      position: absolute;
      left: -4px;
      top: 110px;
      width: 4px;
      height: 28px;
      background: #2e2e30;
      border-radius: 2px 0 0 2px;
      box-shadow: -1px 0 3px rgba(0,0,0,0.5);
    }

    .btn-vol-up {
      position: absolute;
      left: -4px;
      top: 160px;
      width: 4px;
      height: 44px;
      background: #2e2e30;
      border-radius: 2px 0 0 2px;
      box-shadow: -1px 0 3px rgba(0,0,0,0.5);
    }

    .btn-vol-down {
      position: absolute;
      left: -4px;
      top: 218px;
      width: 4px;
      height: 44px;
      background: #2e2e30;
      border-radius: 2px 0 0 2px;
      box-shadow: -1px 0 3px rgba(0,0,0,0.5);
    }

    /* Right side: power/lock button */
    .btn-power {
      position: absolute;
      right: -4px;
      top: 180px;
      width: 4px;
      height: 72px;
      background: #2e2e30;
      border-radius: 0 2px 2px 0;
      box-shadow: 1px 0 3px rgba(0,0,0,0.5);
    }

    /* Screen cutout */
    .screen {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 24px;
      border-radius: 38px;
      overflow: hidden;
      background: #000;
    }

    /* Dynamic island notch — floats above iframe */
    .notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 34px;
      background: #1c1c1e;
      border-radius: 20px;
      z-index: 10;
      box-shadow: 0 0 0 1px #2a2a2c;
    }

    /* Camera dot inside notch */
    .notch::after {
      content: '';
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #0d0d14;
      box-shadow: inset 0 0 0 2px #2a2a2c, 0 0 6px rgba(50, 80, 200, 0.3);
    }

    .screen-iframe {
      width: 390px;
      height: 844px;
      border: none;
      display: block;
    }

    /* Home indicator bar */
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: #3a3a3c;
      border-radius: 3px;
    }

    /* Speaker grille at top of phone body */
    .speaker {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 6px;
      background: #111;
      border-radius: 3px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="speaker"></div>

    <div class="btn-mute"></div>
    <div class="btn-vol-up"></div>
    <div class="btn-vol-down"></div>
    <div class="btn-power"></div>

    <div class="screen">
      <div class="notch"></div>
      <iframe
        src="index.html"
        class="screen-iframe"
        scrolling="yes"
        title="Kaiser Claims Portal — Mobile"
      ></iframe>
    </div>

    <div class="home-bar"></div>
  </div>
</body>
</html>
